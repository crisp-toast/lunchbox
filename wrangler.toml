# Cloudflare Pages: the site in site/, the store in functions/ (see docs/store.md).
name = "tessel"
pages_build_output_dir = "site"
compatibility_date = "2026-10-01"

[vars]
SITE_URL = "https://tessel.sentientdonut.com"
STRIPE_PRICE_ID = "price_REPLACE_ME"
EMAIL_FROM = "Tessel <support@sentientdonut.com>"
SUPPORT_EMAIL = "support@sentientdonut.com"

# Refunded and charged-back orders, as one-way hashes (see functions/api/revoked.js).
# Create it once with: npx wrangler kv namespace create REVOKED   and paste the id here.
[[kv_namespaces]]
binding = "REVOKED"
id = "REPLACE_ME"

# Secrets (never in this file): set each once with
#   npx wrangler pages secret put NAME --project-name tessel
# STRIPE_SECRET_KEY      a restricted key: Checkout Sessions read+write
# STRIPE_WEBHOOK_SECRET  from the webhook endpoint you add in Stripe
# LICENSE_PRIVATE_KEY    the JSON in ~/.config/sentient-donut/tessel-license-signing.jwk
# RESEND_API_KEY         from resend.com, once sentientdonut.com is verified there
