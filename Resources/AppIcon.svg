<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- macOS icon grid: an 824-point body centered on a 1024 canvas -->
  <defs>
    <!-- Body: graphite at the top falling to near-black, lit from above -->
    <linearGradient id="body" x1="0.32" y1="0" x2="0.68" y2="1">
      <stop offset="0" stop-color="#4a4d55"/>
      <stop offset="0.45" stop-color="#1e2024"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.02" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- A thin bevel: bright along the top edge, dark along the bottom -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </linearGradient>
    <!-- Porcelain tiles -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcdfe5"/>
    </linearGradient>
    <linearGradient id="smoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f5f8"/><stop offset="0.5" stop-color="#a6abb5"/><stop offset="1" stop-color="#e3e6eb"/></linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="18" result="b"/>
      <feFlood flood-color="#000000" flood-opacity="0.55"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="halo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#floor)"/>
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <g filter="url(#drop)">
    <rect x="258" y="258" width="232" height="508" rx="40" fill="url(#tile)"/>
    <rect x="534" y="258" width="232" height="232" rx="40" fill="url(#tile)"/>
    <rect x="534" y="534" width="232" height="232" rx="40" fill="url(#smoke)"/>
  </g>
  <rect x="259.5" y="259.5" width="229" height="505" rx="38.5" fill="none" stroke="url(#edge)" stroke-width="3"/>
  <rect x="535.5" y="259.5" width="229" height="229" rx="38.5" fill="none" stroke="url(#edge)" stroke-width="3"/>
  <rect x="535.5" y="535.5" width="229" height="229" rx="38.5" fill="none" stroke="url(#edge)" stroke-width="3" stroke-opacity="0.6"/>
  <rect x="514" y="238" width="272" height="272" rx="57" fill="none" stroke="#ffffff" stroke-width="16" stroke-opacity="0.55" filter="url(#halo)"/>
  <rect x="514" y="238" width="272" height="272" rx="57" fill="none" stroke="url(#ring)" stroke-width="11"/>
</svg>
