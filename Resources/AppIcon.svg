<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- macOS icon grid: an 824-point body centered on a 1024 canvas -->
  <defs>
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fffbf3"/><stop offset="1" stop-color="#ffe8c7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.8"/><stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="0.3" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#d9a15c" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="box" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#6a98ff"/><stop offset="0.45" stop-color="#2f6bff"/><stop offset="1" stop-color="#1d4fe0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.22" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="well" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1437a8"/><stop offset="1" stop-color="#1b46c8"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a76"/><stop offset="1" stop-color="#f2552f"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fe6b9"/><stop offset="1" stop-color="#14b685"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd75c"/><stop offset="1" stop-color="#f5a00c"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g transform="translate(100 100) scale(0.919643) translate(-64 -64)">
  <rect x="64" y="64" width="896" height="896" rx="212" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="212" fill="url(#glow)"/>
  <rect x="67" y="67" width="890" height="890" rx="209" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <!-- no handle: the box sits centered on the tile -->
  <g transform="translate(0 -76)">
  <!-- a soft shadow on the cream -->
  <rect x="156" y="318" width="712" height="584" rx="110" fill="#b8742a" fill-opacity="0.10"/>
  <rect x="152" y="304" width="720" height="586" rx="106" fill="#b8742a" fill-opacity="0.12"/>
  <!-- the box -->
  <rect x="148" y="286" width="728" height="590" rx="106" fill="url(#box)"/>
  <rect x="148" y="286" width="728" height="590" rx="106" fill="url(#sheen)"/>
  <rect x="150" y="288" width="724" height="586" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="4"/>
  <rect x="192" y="330" width="640" height="502" rx="68" fill="url(#well)"/>
  <!-- three compartments: the layout LunchboxWM makes -->
  <rect x="222" y="360" width="274" height="442" rx="46" fill="url(#coral)"/><rect x="222" y="360" width="274" height="442" rx="46" fill="url(#gloss)"/><rect x="224" y="362" width="270" height="438" rx="44" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="4"/>
  <rect x="528" y="360" width="274" height="205" rx="46" fill="url(#mint)"/><rect x="528" y="360" width="274" height="205" rx="46" fill="url(#gloss)"/><rect x="530" y="362" width="270" height="201" rx="44" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="4"/>
  <rect x="528" y="597" width="274" height="205" rx="46" fill="url(#amber)"/><rect x="528" y="597" width="274" height="205" rx="46" fill="url(#gloss)"/><rect x="530" y="599" width="270" height="201" rx="44" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="4"/>
  <!-- the clasp -->
  <rect x="460" y="852" width="104" height="44" rx="16" fill="#e9efff"/>
  <rect x="460" y="852" width="104" height="44" rx="16" fill="none" stroke="#1d4fe0" stroke-opacity="0.5" stroke-width="4"/>
  </g>
  </g>
</svg>
